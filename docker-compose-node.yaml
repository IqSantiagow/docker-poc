services:
  chrome-node:
    image: selenium/node-chrome:4.15.0
    container_name: chrome-node-${BUILD_NUMBER:-default}
    shm_size: 2gb
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - selenium-network

networks:
  selenium-network:
    name: selenium-grid-network
    driver: bridge
    external: true